<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学生会群 · 嘻嗨校园</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script src="core.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{--bg:#eef1f8;--panel:#ffffff;--panel2:#eaf0fb;--line:#d4dcee;--txt:#1b2340;--sub:#5b6a90;--accent:#7a5cff;--danger:#ff5d6c;--ok:#2fbf8f;--warn:#e08a2e}
[data-theme="dark"]{--bg:#0d0a18;--panel:#171228;--panel2:#221a3d;--line:#372b5c;--txt:#ece9f8;--sub:#9b8fc4;--accent:#8a6cff;--danger:#ff5d6c;--ok:#2fbf8f;--warn:#e8a13c}
body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,sans-serif;height:100vh;overflow:hidden}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;padding:7px 14px;font-size:14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:14px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--sub);font-size:12px}
#scr-council{position:fixed;inset:0;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;gap:10px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
header.top .logo{font-weight:bold;font-size:16px}
header.top .who{color:var(--sub);font-size:12px}
header.top .grow{flex:1}
.body{flex:1;display:grid;grid-template-columns:1fr 330px;overflow:hidden}
.left{display:flex;flex-direction:column;min-width:0}
.left .head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.left .head .ttl{font-weight:bold;font-size:15px}
.chatbox{flex:1;display:flex;flex-direction:column;background:var(--panel2);margin:14px 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:0}
.chatlog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;word-break:break-word}
.msg.mine{align-self:flex-end;background:rgba(122,92,255,.16);border-color:rgba(122,92,255,.45)}
.msg .mname{font-size:11px;color:var(--sub);margin-bottom:3px}
.msg .mt{font-size:11px;color:var(--sub);margin-top:4px;text-align:right}
.msg.sys{align-self:center;max-width:92%;background:rgba(122,92,255,.12);border:1px dashed var(--accent);color:var(--txt)}
.msg.call{max-width:94%;align-self:center;width:100%;background:var(--panel);border:1px solid var(--accent);border-left:5px solid var(--accent)}
.msg.call .cbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.msg.call .cbtns button{padding:5px 12px;font-size:13px}
.chatinput{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatinput input{flex:1;margin:0}
.right{background:var(--panel);border-left:1px solid var(--line);padding:14px;overflow-y:auto}
.right h4{font-size:13px;margin:14px 0 8px;color:var(--sub)}
.right h4:first-child{margin-top:2px}
.panel-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;font-size:13px}
.panel-card .row2{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.panel-card .row2 button{flex:1;padding:6px 8px;font-size:12px;white-space:nowrap}
.panel-card p{margin:4px 0;line-height:1.6}
.req-item{background:var(--panel2);border:1px solid var(--danger);border-radius:10px;padding:11px;margin-bottom:10px;font-size:13px}
.memberchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.mchip .d{width:7px;height:7px;border-radius:50%;background:#4a5a80}
.mchip .d.on{background:var(--ok)}
.mchip button{border:none;background:none;color:var(--danger);padding:0 2px;font-size:13px;cursor:pointer}
#toasts{position:fixed;top:14px;right:14px;z-index:100;width:320px;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:slidein .25s ease}
.toast.warn{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.toast .tt{line-height:1.5;word-break:break-word}
.toast .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast .btns button{padding:5px 10px;font-size:12px}
.toast textarea{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px;font-size:12px;resize:vertical;min-height:52px;font-family:inherit}
#gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:860px){.body{grid-template-columns:1fr}.right{display:none}}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="gate" class="hidden">
  <b style="font-size:20px">⭐ 学生会群</b>
  <p class="muted" id="gateMsg">你不是本校学生会成员，或尚未登录。</p>
  <button id="gateBack" class="primary">返回主页</button>
</div>
<div id="scr-council" class="screen hidden">
  <header class="top">
    <span class="logo">⭐ 学生会群</span>
    <span class="who" id="councilName"></span>
    <span class="grow"></span>
    <span class="who" id="connState">连接中…</span>
    <button id="backBtn" class="ghost">← 主页</button>
  </header>
  <div class="body">
    <div class="left">
      <div class="head">
        <span class="ttl">💬 学生会讨论</span>
        <span class="muted" id="councilHint"></span>
      </div>
      <div class="chatbox">
        <div class="chatlog" id="chatLog"></div>
        <div class="chatinput">
          <button id="chatEmoji" class="ghost" title="表情">😊</button>
          <button id="chatGif" class="ghost" title="GIF 表情包">🎬</button>
          <input id="chatMsg" placeholder="发言 / 询问管理员…（@管理员 或 @成员名 会提醒对方，可直接粘贴图片）" maxlength="500">
          <button id="chatSend" class="primary">发送</button>
          <button id="askBtn" class="ghost" title="向管理员提问，管理员会收到醒目提醒">❓ 询问管理员</button>
          <button id="reqMeetBtn" class="ok">📢 申请发起会议</button>
        </div>
      </div>
    </div>
    <div class="right">
      <h4>📢 发起会议申请（需管理员批准）</h4>
      <div id="reqBox"></div>
      <h4>🎥 进行中的会议</h4>
      <div id="meetBox"></div>
      <h4>👥 群成员 <span class="muted" id="memCount"></span></h4>
      <div class="memberchips" id="memList" style="margin-bottom:10px"></div>
      <div id="adminBox" class="hidden">
        <h4>➕ 拉学生进学生会群</h4>
        <div class="row" style="display:flex;gap:6px">
          <select id="pullStudent"></select>
          <button id="pullBtn" class="primary">拉入</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="council.js"></script>
</body>
</html>
