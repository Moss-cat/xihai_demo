<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议室 · 嘻嗨校园</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
<script src="core.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root,[data-theme="light"]{--bg:#eef1f8;--panel:#ffffff;--panel2:#eaf0fb;--line:#d4dcee;--txt:#1b2340;--sub:#5b6a90;--accent:#4f8cff;--danger:#ff5d6c;--ok:#2fbf8f}
[data-theme="dark"]{--bg:#0b101c;--panel:#141c2e;--panel2:#1d2740;--line:#29365a;--txt:#e9eef8;--sub:#8da0c4;--accent:#4f8cff;--danger:#ff5d6c;--ok:#2fbf8f}
body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,sans-serif;height:100vh;overflow:hidden}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;padding:7px 14px;font-size:14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{background:var(--danger);border-color:var(--danger);color:#fff}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none!important}
.muted{color:var(--sub);font-size:12px}
#scr-meet{position:fixed;inset:0;display:flex;flex-direction:column}
#scr-meet header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;font-size:14px}
#scr-meet header .grow{flex:1}
#connState{font-size:12px;color:var(--sub)}
#meetBody{flex:1;display:flex;overflow:hidden;position:relative}
#videoGrid{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;padding:12px;overflow-y:auto;align-content:start}
.vcell{position:relative;background:#060a14;border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:150px;display:flex;align-items:center;justify-content:center}
.vcell video{width:100%;height:100%;object-fit:cover}
.vcell .tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);padding:3px 10px;border-radius:6px;font-size:12px;color:#fff}
.vcell .tag.host{color:#ffd76a}
.vcell .novideo{color:#7c8db0;font-size:13px}
#waitingOverlay{position:absolute;inset:0;background:rgba(8,11,20,.86);display:flex;align-items:center;justify-content:center;z-index:5}
#waitingOverlay .box{width:300px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 20px;display:flex;flex-direction:column;gap:8px}
#sidePanel{width:290px;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow-y:auto;flex:none}
#sidePanel h4{font-size:13px;margin:10px 0 8px;color:var(--sub)}
#sidePanel h4:first-child{margin-top:2px}
.pitem{display:flex;align-items:center;gap:8px;background:var(--panel2);border-radius:8px;padding:7px 9px;margin-bottom:6px;font-size:13px}
.pitem .n{flex:1;word-break:break-all}
.pitem button{padding:3px 8px;font-size:12px;flex:none}
.pitem .dot{width:8px;height:8px;border-radius:50%;background:#4a5a80;flex:none}
.pitem .dot.on{background:var(--ok)}
footer.ctrl{display:flex;gap:10px;justify-content:center;align-items:center;padding:10px;background:var(--panel);border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
#toasts{position:fixed;top:14px;right:14px;z-index:100;width:320px;display:flex;flex-direction:column;gap:10px}
#approveBox{position:fixed;top:14px;left:14px;z-index:100;width:300px;display:flex;flex-direction:column;gap:10px}
.apcard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:slideinL .25s ease}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.5);animation:slidein .25s ease}
.toast.warn{border-left-color:var(--danger)}
.toast.ok{border-left-color:var(--ok)}
.toast .tt{line-height:1.5}
.toast .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.toast .btns button{padding:5px 10px;font-size:12px}
.toast textarea{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px;font-size:12px;resize:vertical;min-height:52px;font-family:inherit}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideinL{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:760px){#sidePanel{position:absolute;right:0;top:0;bottom:0;z-index:6;box-shadow:-10px 0 30px rgba(0,0,0,.4)}}
</style>
</head>
<body>
<div id="toasts"></div>
<div id="approveBox"></div>
<div id="scr-meet">
  <header>
    <b id="meetTitle"></b>
    <span class="muted">会议码 <b id="meetCode"></b></span>
    <span class="muted" id="meetCount"></span>
    <span class="grow"></span>
    <span class="muted" id="meetRole"></span>
    <span id="connState">连接中…</span>
    <button id="backHome" class="ghost">返回</button>
  </header>
  <div id="meetBody">
    <div id="videoGrid"></div>
    <div id="sidePanel" class="hidden"></div>
    <div id="waitingOverlay" class="hidden"><div class="box"><h3>等待主持人批准…</h3><p class="muted">正在向主持人申请进入会议</p><button id="cancelWait" class="danger">取消</button></div></div>
  </div>
  <footer class="ctrl">
    <button id="micBtn">🎤 麦克风：开</button>
    <button id="camBtn">📷 摄像头：开</button>
    <button id="sideBtn">👥 成员 / 邀请</button>
    <button id="leaveBtn" class="danger">🚪 离开</button>
    <button id="endBtn" class="hidden danger">⛔ 结束会议</button>
  </footer>
</div>
<script src="room.js"></script>
</body>
</html>
